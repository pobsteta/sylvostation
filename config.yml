# Paramètres d'exécution de sylvostation (lus par read_config()).
# Toutes les coordonnées sont en Lambert-93 (EPSG:2154), x = est, y = nord.

# Code de la sylvoécorégion. À vérifier (mission 001) : valeur d'essai.
ser_code: "D11"  # vérifié (mission 001) : SER « Massif vosgien central », couche ser_l93.zip, champ codeser

# Emprise de test (phase 0), en mètres.
emprise_test:
  xmin: 1007000
  ymin: 6790000
  xmax: 1022000
  ymax: 6805000
  crs: 2154

# Valeurs provisoires (brief : 10-25 m et 5-10 km), à geler avant la phase 1.
buffer_m: 5000
resolution_m: 25

crs: 2154

data_dir: data
laz_dir: data/laz
out_dir: data/sorties

# Précision de localisation des placettes IFN (règle bloquante).
ifn_precision_m: 700

# Mode démonstration : le pipeline tourne sans réseau sur inst/extdata (jeux synth_*,
# synthetic = TRUE) ; sorties sous data/. Les résultats ne valent RIEN sur données réelles.
demo: true

# --- Mode réel (mission 016), lu seulement avec `demo: false` ---------------------------
# offline: true = mode réel SANS RÉSEAU sur les extraits réels de inst/extdata (CI, tests).
offline: false
# Nombre maximal de dalles LiDAR (essai court, par exemple 4) ; null = toutes.
max_tiles: null
# test = emprise_test recoupée avec la SER tamponnée (225 dalles) ; ser = SER entière.
emprise: test
# Valeurs provisoires (journal, mission 003), à geler avant la phase 1.
lidar_block_size: 3
lidar_buffer_m: 20
lidar_ncores: 3
# Version de TAXREF figée (jointures CD_NOM puis CD_REF) ; doit figurer dans le nom du fichier.
taxref_version: "18"
taxref_url: "https://assets.patrinat.fr/files/referentiel/TAXREF_v18_2025.zip"
indicator_source: tichy
# Classeur Zenodo de Tichý et al. (2023), à poser en local pour le mode en ligne (URL directe à vérifier).
tichy_path: null
ru_source: euptf2
# Climat SAFRAN (SIM2) : période provisoire ; saison de végétation avril-septembre (provisoire).
safran_annees: [1996, 2025]
saison_vegetation: [4, 9]
# Carte hydrique de 25 m (mission 021) : k = rayonnement r.sun (ciel clair) de la pente /
# plat, ETP Penman biljouR sur SSI x k. Valeurs provisoires (referentiels § 25.5), à geler
# avant la phase 1 : trouble de Linke, albédo, pas de temps de r.sun (h), pas des classes
# de k et nombre de cellules de contrôle (calcul direct) par maille SAFRAN.
solar_linke: 3.0
solar_albedo: 0.2
solar_step_h: 0.5
hydric_pas_k: 0.02
hydric_n_controle: 30
# Téléchargements (SER, dalles LiDAR, WFS, TOPAGE, SAFRAN, IFN) : nombre total de tentatives
# avant arrêt (attentes 5, 20, 60 s). Provisoire (mission 026).
download_retries: 3
# Départements BD Charm-50 de l'emprise (référentiels § 5) : liste explicite.
bdcharm_departements: ["067", "068", "088"]
ifn_archive_url: "https://inventaire-forestier.ign.fr/dataifn/data/export_dataifn_2005_2025.zip"
# GBIF : search sans compte ; download si GBIF_USER, GBIF_PWD, GBIF_EMAIL sont posées.
gbif_method: search
# Masque forestier : MHC > forest_height_m sur au moins la moitié de la cellule de 25 m.
forest_mask: true
forest_height_m: 5
cache_dir: data/cache
# Entrées optionnelles : absentes = signalées dans l'état de preuve, jamais remplacées.
gnss_path: null
reference_path: null
soil_paths: null
