name: pkgdown

# Site pkgdown (mission 023). Sur pull request : construction seule, SANS déploiement.
# Sur push vers main : construction puis déploiement sur la branche gh-pages.
# L'article des résultats lit des figures précalculées et versionnées (vignettes/articles/figures) :
# aucun calcul de pipeline, aucun téléchargement de données en CI.
# Prérequis (à faire par Pascal, une fois) : Réglages > Pages > Source = branche gh-pages.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write   # écriture sur gh-pages, utilisée seulement à l'étape de déploiement
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://r-lidar.r-universe.dev

      - name: Installer Rdpack (euptf2 en a besoin à la construction sans le déclarer)
        run: Rscript -e 'install.packages("Rdpack", repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Construire le site
        run: Rscript -e 'pkgdown::check_pkgdown(); pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      # Seulement sur un push de main : jamais depuis une pull request ni une autre branche.
      - name: Déployer sur gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: site
