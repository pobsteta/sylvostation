url: https://pobsteta.github.io/sylvostation/
# Le dossier docs/ du dépôt porte la documentation du projet (brief, ADR) : le site se construit ailleurs.
destination: site
template:
  bootstrap: 5
lang: fr

# Site pkgdown de sylvostation (mission 023). Déployé par .github/workflows/pkgdown.yaml,
# seulement depuis `main`. Les articles de vignettes/articles/ ne sont pas construits au
# R CMD check (.Rbuildignore) ; l'article des résultats lit des figures précalculées
# (inst/scripts/figures_article_vosges.R) et ne calcule rien.

navbar:
  structure:
    left: [intro, reference, articles, news]
  components:
    articles:
      text: Articles
      menu:
        - text: "Résultats sur le massif test vosgien (D11)"
          href: articles/resultats-vosges-d11.html
        - text: "Massif test : du code SER au catalogue (démo)"
          href: articles/massif-test.html

articles:
  - title: Résultats
    navbar: ~
    contents:
      - starts_with("articles/resultats")
  - title: Prise en main
    contents:
      - starts_with("massif")

reference:
